schemaVersion: 2
project:
  name: evoworkflow
workflow:
  defaultWeight: STANDARD
  requireHumanApproval: true
  autoCommit: false
  autoFinish: false
knowledge:
  staleWorkDays: 30
  agentsMaxLines: 200
goal:
  defaultAdapter: codex
  maxAttempts: 3
agents:
  adapters:
    codex:
      kind: codex
      command: codex
      args:
        - exec
        - --sandbox
        - workspace-write
        - --cd
        - "{repository}"
        - "-"
      timeoutMs: 3600000
    claude:
      kind: claude
      command: claude
      args:
        - --print
        - --permission-mode
        - acceptEdits
        - --output-format
        - json
      timeoutMs: 3600000
    opencode:
      kind: opencode
      command: opencode
      args:
        - run
        - --dir
        - "{repository}"
      timeoutMs: 3600000
