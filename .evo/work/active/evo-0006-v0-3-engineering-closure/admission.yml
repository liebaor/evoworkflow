ance、evidence、stop conditions、knowledge promotion。 | 不自研 generic context compression、tool search、subagent scheduler 或通用 Agent Runtime。 | 不要求每个 Slice 默认跑全量测试；验证继续匹配风险与影响范围。 | 不建立 `.evo/commit-history/` 等第二套 Git 历史数据库。 | 不做云控制面板、Web UI、中央数据库或 Vector DB/RAG 平台。 | 不做多 Agent 并行 swarm。 | 不做按语言穷举的全功能静态分析器，也不硬编码 RuoYi Framework Profile。"
