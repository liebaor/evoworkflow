name: Validate EVOworkflow

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate product contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "3.0.0"
          grep -Fq 'project evolution layer' README.md
          grep -Fq 'Repository Engineering Contract' README.md
          grep -Fq 'Selective Invalidation' README.md
          grep -Fq 'AGENTS.md' README.md

      - name: Validate core Skill set
        shell: bash
        run: |
          set -euo pipefail
          expected=(ask-evo evo-init evo-refresh evo-change evo-learn evo-recover)
          mapfile -t actual < <(find skills -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${actual[@]}" > /tmp/actual
          diff -u /tmp/expected /tmp/actual

          for skill in "${expected[@]}"; do
            test -f "skills/$skill/SKILL.md"
            test -f "skills/$skill/agents/openai.yaml"
            grep -q "^name: $skill$" "skills/$skill/SKILL.md"
            grep -q '^description: ' "skills/$skill/SKILL.md"
            grep -q '^compatibility: ' "skills/$skill/SKILL.md"
            grep -q '^disable-model-invocation: true$' "skills/$skill/SKILL.md"
            grep -Fq 'opencode/autoinvoke: "false"' "skills/$skill/SKILL.md"
            grep -Fq 'allow_implicit_invocation: false' "skills/$skill/agents/openai.yaml"
          done

      - name: Validate knowledge contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.evo/' docs/knowledge-model.md
          grep -Fq 'project.md' docs/knowledge-model.md
          grep -Fq 'references.md' docs/knowledge-model.md
          grep -Fq 'capabilities.md' docs/knowledge-model.md
          grep -Fq 'current.md' docs/knowledge-model.md
          grep -Fq 'changes/' docs/knowledge-model.md
          grep -Fq 'learnings/' docs/knowledge-model.md
          grep -Fq 'Authoritative' docs/knowledge-model.md
          grep -Fq 'Representative' docs/knowledge-model.md
          grep -Fq 'Observed' docs/knowledge-model.md
          grep -Fq 'One Fact → One Owner' docs/knowledge-model.md
          grep -Fq 'Progressive disclosure' docs/knowledge-model.md

      - name: Validate Skill semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Repository Engineering Contract' skills/evo-init/SKILL.md
          grep -Fq 'Reference Before Edit' skills/evo-init/SKILL.md
          grep -Fq 'Capability Before Creation' skills/evo-init/SKILL.md
          grep -Fq 'evidence surface' skills/evo-refresh/SKILL.md
          grep -Fq 'Selective Invalidation' skills/evo-change/SKILL.md
          grep -Fq 'Promotion test' skills/evo-learn/SKILL.md
          grep -Fq 'chat history' skills/evo-recover/SKILL.md
          grep -Fq 'NORMAL_ENGINEERING_WORKFLOW' skills/ask-evo/SKILL.md

      - name: Validate templates
        shell: bash
        run: |
          set -euo pipefail
          for f in project current references capabilities change learning; do
            test -f "templates/$f.md"
          done

      - name: Ensure repository is workflow-only
        shell: bash
        run: |
          set -euo pipefail
          test ! -d src
          test ! -f package.json
          test ! -d node_modules
